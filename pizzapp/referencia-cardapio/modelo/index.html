<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo — Cardápio Pizzapp (referência Kituti/Menui)</title>
<style>
  :root {
    --red: #EA1D2C;
    --green: #10B981;
    --ink: #111827;
    --muted: #5F6368;
    --bg: #F8F9FA;
    --card: #FFFFFF;
    --line: #E0E0E0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding-bottom: 96px; }

  /* Capa + loja */
  .cover { height: 150px; background: linear-gradient(135deg, #7a0e14, var(--red) 60%, #FF6D00); position: relative; }
  .store { background: var(--card); border-bottom: 1px solid var(--line); padding: 0 16px 14px; }
  .store-row { display: flex; gap: 12px; align-items: flex-end; margin-top: -28px; }
  .logo { width: 72px; height: 72px; border-radius: 16px; background: #fff; border: 3px solid #fff;
          display: flex; align-items: center; justify-content: center; font-size: 38px;
          box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .store h1 { font-size: 1.25em; }
  .store .city { color: var(--muted); font-size: .85em; }
  .badges { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; font-size: .8em; }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; background: #fff; }
  .badge.open { color: var(--green); border-color: var(--green); font-weight: 700; }

  /* Busca */
  .search { padding: 12px 16px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .search input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); font-size: 1em; }

  /* Categorias */
  .category-nav { overflow-x: auto; padding: 10px 16px; }
  .category-nav-list { display: flex; gap: 8px; list-style: none; }
  .category-nav-link { white-space: nowrap; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font-size: .9em; cursor: pointer; }
  .category-nav-link small { color: var(--muted); }
  .category-nav-link.is-active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .category-nav-link.is-active small { color: #ddd; }

  /* Seções + cards */
  .category-title { padding: 14px 16px 8px; font-size: 1.1em; }
  .products-grid { display: flex; flex-direction: column; gap: 10px; padding: 0 16px; }
  .regular-product-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px; position: relative; cursor: pointer; }
  .regular-product-layout { display: flex; gap: 12px; }
  .product-image-container { width: 86px; height: 86px; flex-shrink: 0; }
  .regular-product-image { width: 100%; height: 100%; border-radius: 10px; background: #f1f1f1;
    display: flex; align-items: center; justify-content: center; font-size: 34px; }
  .regular-product-image.foto { background: linear-gradient(135deg, #ffd9a0, #ff9d5c); }
  .regular-product-content { flex: 1; min-width: 0; }
  .regular-product-name { font-weight: 700; }
  .tag-build { font-size: .68em; background: #fff3e0; color: #c25700; border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
  .regular-product-description { color: var(--muted); font-size: .85em; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .regular-product-price { margin-top: 6px; font-weight: 700; }
  .unavailable { font-size: .72em; color: var(--red); font-weight: 700; }
  .product-add-cta { position: absolute; right: 12px; bottom: 12px; width: 32px; height: 32px;
    border-radius: 50%; background: var(--red); color: #fff; display: flex;
    align-items: center; justify-content: center; font-size: 20px; line-height: 1; }
  .regular-product-card.is-off { opacity: .65; }

  /* Carrinho */
  .cart-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
    background: #fff; border-top: 1px solid var(--line); display: none; }
  .cart-bar.show { display: block; }
  .cart-bar button { width: 100%; max-width: 720px; margin: 0 auto; display: block;
    background: var(--red); color: #fff; border: 0; border-radius: 12px;
    padding: 14px; font-size: 1em; font-weight: 700; cursor: pointer; }
  .note { padding: 16px; color: var(--muted); font-size: .8em; }
</style>
</head>
<body>
<div class="wrap">

  <div class="cover"></div>
  <div class="store">
    <div class="store-row">
      <div class="logo">🍕</div>
      <div>
        <h1>Bilubilu Pizzaria</h1>
        <div class="city">Salvador - BA</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge open">● Aberto agora</span>
      <span class="badge">🛵 Entrega 40min</span>
      <span class="badge">🛍️ Retirada 20min</span>
    </div>
  </div>

  <div class="search">
    <input id="search" type="text" placeholder="Buscar no cardápio..." oninput="filtrar()">
  </div>

  <nav class="category-nav">
    <ul class="category-nav-list" id="chips"></ul>
  </nav>

  <div id="menu"></div>

  <p class="note">MODELO estático de referência (não ligado ao sistema). Demonstra: capa+logo da loja, status, busca, categorias com contadores, cards com foto, "Monte o seu", indisponível e botão +.</p>
</div>

<div class="cart-bar" id="cartbar">
  <button onclick="alert('No sistema real, abre o checkout')">Ver carrinho · <span id="cartcount">0</span> itens</button>
</div>

<script>
  const DATA = [
    { cat: "Pizzas", items: [
      { nome: "Calabresa", desc: "Molho, mussarela, calabresa e cebola", preco: "R$ 45,00", foto: true },
      { nome: "Monte sua pizza", desc: "Escolha massa, molho e até 3 extras", preco: "a partir de R$ 39,00", foto: false, build: true },
      { nome: "Portuguesa", desc: "Presunto, ovos, ervilha, cebola e azeitona", preco: "R$ 48,00", foto: true, off: true },
    ]},
    { cat: "Calzones", items: [
      { nome: "Calzone de frango", desc: "Frango desfiado, catupiry e milho", preco: "R$ 32,00", foto: false },
    ]},
    { cat: "Bebidas", items: [
      { nome: "Refrigerante lata", desc: "Coca, Guaraná ou laranja · 350ml", preco: "R$ 6,00", foto: true },
      { nome: "Suco natural", desc: "Maracujá, manga ou abacaxi · 500ml", preco: "R$ 9,00", foto: false },
    ]},
    { cat: "Sobremesas", items: [
      { nome: "Pizza de chocolate", desc: "Chocolate ao leite e granulado", preco: "R$ 35,00", foto: true },
    ]},
  ];

  let filtroCat = null, busca = "", carrinho = 0;

  function renderChips() {
    const ul = document.getElementById("chips");
    const total = DATA.reduce((s, c) => s + c.items.length, 0);
    let h = `<li><button class="category-nav-link ${!filtroCat ? "is-active" : ""}" onclick="selCat(null)">Cardápio completo <small>${total}</small></button></li>`;
    DATA.forEach(c => {
      h += `<li><button class="category-nav-link ${filtroCat === c.cat ? "is-active" : ""}" onclick="selCat('${c.cat}')">${c.cat} <small>${c.items.length}</small></button></li>`;
    });
    ul.innerHTML = h;
  }

  function selCat(c) { filtroCat = c; render(); }
  function filtrar() { busca = document.getElementById("search").value.toLowerCase(); render(); }
  function add() { carrinho++; document.getElementById("cartcount").textContent = carrinho; document.getElementById("cartbar").classList.add("show"); }

  function render() {
    renderChips();
    const box = document.getElementById("menu");
    box.innerHTML = "";
    DATA.filter(c => !filtroCat || c.cat === filtroCat).forEach(c => {
      const items = c.items.filter(i => (i.nome + " " + i.desc).toLowerCase().includes(busca));
      if (!items.length) return;
      let h = `<h2 class="category-title">${c.cat}</h2><div class="products-grid">`;
      items.forEach(i => {
        h += `<div class="regular-product-card ${i.off ? "is-off" : ""}" onclick="add()">
          <div class="regular-product-layout">
            <div class="product-image-container"><div class="regular-product-image ${i.foto ? "foto" : ""}">${i.foto ? "📸" : "🍽"}</div></div>
            <div class="regular-product-content">
              <div class="regular-product-name">${i.nome}${i.build ? '<span class="tag-build">Monte o seu</span>' : ""}</div>
              <div class="regular-product-description">${i.desc}</div>
              <div class="regular-product-price">${i.off ? '<span class="unavailable">Indisponível</span> · ' : ""}${i.preco}</div>
            </div>
          </div>
          ${i.off ? "" : '<span class="product-add-cta">+</span>'}
        </div>`;
      });
      box.innerHTML += h + "</div>";
    });
    if (!box.innerHTML) box.innerHTML = '<p class="note">Nenhum resultado. Tente outras palavras.</p>';
  }

  render();
</script>
</body>
</html>
